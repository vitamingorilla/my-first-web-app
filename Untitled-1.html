<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Site</title>
    <style>
        /* h1 の文字を青色にする */
        h1 {
            color: blue;
        }

        /* p の文字を緑色にする */
        p {
            color: green;
        }

        /* 特定のクラスを作って色を変える */
        .highlight {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Welcome to My GitHub Pages Site</h1>
    <p>This is my first GitHub Pages deployment!</p>
    <p class="highlight">この部分だけ赤色で強調表示！</p>
</body>
</html>
